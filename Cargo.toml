[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/commands",
    "crates/platform",
    "crates/xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/CMSpeedAU/NoteCraft"
authors = ["NoteCraft contributors"]

[workspace.dependencies]
nc-commands = { path = "crates/commands" }
nc-platform = { path = "crates/platform" }

anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
