[package]
name = "nc-platform"
description = "NoteCraft platform services: window creation, message loop, shell integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
nc-commands.workspace = true
thiserror.workspace = true
tracing.workspace = true

# The portable window backend, off by default: the shipped Windows build uses
# the native backend, and the egui backend is there for hosts without Win32.
eframe = { workspace = true, optional = true }
egui = { workspace = true, optional = true }

[features]
# Present the shell through egui/eframe instead of the native Win32 backend.
egui = ["dep:eframe", "dep:egui"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
