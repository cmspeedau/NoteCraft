[package]
name = "nc-textproc"
description = "NoteCraft text processing: encoding detection and file I/O"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
nc-core.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

# Integration tests are named after the test files `docs/feature-matrix.md`
# gives each feature (`tests/file_io/eol.rs` for NC-D004, and so on), so the
# matrix and the suite stay in step.
[[test]]
name = "encoding_utf8"
path = "tests/file_io/encoding_utf8.rs"

[[test]]
name = "encoding_utf16"
path = "tests/file_io/encoding_utf16.rs"

[[test]]
name = "encoding_ansi"
path = "tests/file_io/encoding_ansi.rs"

[[test]]
name = "eol"
path = "tests/file_io/eol.rs"

[[test]]
name = "dirty"
path = "tests/file_io/dirty.rs"

[[test]]
name = "errors"
path = "tests/file_io/errors.rs"

[[test]]
name = "stress"
path = "tests/file_io/stress.rs"

[[test]]
name = "external_change"
path = "tests/file_io/external_change.rs"

[[test]]
name = "open"
path = "tests/file_io/open.rs"

[[test]]
name = "save"
path = "tests/file_io/save.rs"

[[test]]
name = "save_as"
path = "tests/file_io/save_as.rs"

[[test]]
name = "new_document"
path = "tests/editing/new_document.rs"

[[test]]
name = "find"
path = "tests/editing/find.rs"

[[test]]
name = "find_options"
path = "tests/editing/find_options.rs"

[[test]]
name = "find_boundary"
path = "tests/editing/find_boundary.rs"

[[test]]
name = "replace"
path = "tests/editing/replace.rs"

[[test]]
name = "go_to"
path = "tests/editing/go_to.rs"

[[test]]
name = "time_date"
path = "tests/editing/time_date.rs"

[[test]]
name = "properties"
path = "tests/properties.rs"
